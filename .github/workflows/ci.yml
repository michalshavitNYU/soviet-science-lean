name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml markdown

      - name: Validate entries
        run: python3 scripts/catalog.py validate

      - name: Build Lean library (with Mathlib cache)
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true

      - name: Audit axioms and compute Lean levels
        run: python3 scripts/catalog.py audit

      - name: Build site and dataset
        run: python3 scripts/catalog.py site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
