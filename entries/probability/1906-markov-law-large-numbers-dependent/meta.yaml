id: 1906-markov-law-large-numbers-dependent
subject: probability
title_original: Распространение закона больших чисел на величины, зависящие друг от друга
title_en: Extension of the law of large numbers to quantities depending on each other
authors: [A. A. Markov]
year: 1906
language: ru
source: >
  Izvestiya Fiziko-matematicheskogo obshchestva pri Kazanskom universitete (Bulletin de la
  Société physico-mathématique de Kasan), 2nd series, 15 (1906), no. 4, 135–156. The issue is
  dated 1906; the text is signed 16 January and 25 March 1907.
links:
  - https://dspace.spbu.ru/items/088210fb-8460-489c-808c-05b4103f9963
summary: >
  The paper in which Markov chains first appear. Markov notes that Chebyshev's proof of the law
  of large numbers only needs the variance of the sum to grow more slowly than n², and shows this
  happens for some dependent quantities: when the correlations are negative (§1), for a sequence
  of trials in which the chance of an event depends only on whether it occurred at the previous
  trial (§2, with the exact correlations pq(p' − p'')^{k−l}), and for a general chain with
  finitely many values and positive transition probabilities (§5, by a contraction argument for
  conditional expectations). An urn of Pólya type (§4) shows the law can fail under dependence.
existing_translations:
  - >
    "Extension of the law of large numbers to quantities, depending on each other (1906).
    Reprint", Journal Électronique d'Histoire des Probabilités et de la Statistique 2(1b) (2006),
    article 10, 12 pp. (English; the source of the reprinted translation was not checked).
copyright:
  status: public-domain
  note: >
    Author died 1922 and the paper was published in 1906 (the issue appeared in 1907): public
    domain in Russia (life + 70 years expired in 1992; the wartime extension applies only to
    authors who worked during or fought in the 1941–45 war) and in the US (published before
    1931). Scan in the St Petersburg University repository; no scan is included here.
translation:
  status: complete
  translators: [Claude (AI draft)]
  reviewed_by: []
