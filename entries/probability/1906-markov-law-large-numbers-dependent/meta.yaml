contributors: [Michal Shavit]
help_wanted: >
  Formalize §4: for the urn in which each ball drawn is returned with another of the same
  colour, prove the variance formula ∑ (m − na/(a+b))² P^{a,b}_{m,n} = nab(n+a+b)/((a+b)²(a+b+1))
  and that the law of large numbers fails. Also derive the §3 recurrences for U_{m,k}, V_{m,k}
  from the hypotheses of §2, so that Ω_k is the probability generating function.
