id: 1937-kolmogorov-crystallization
subject: probability
title_original: К статистической теории кристаллизации металлов
title_en: On the statistical theory of the crystallization of metals
authors: [A. N. Kolmogorov]
year: 1937
language: ru
source: Izvestiya Akademii Nauk SSSR, Seriya Matematicheskaya 1(3) (1937), 355–359.
summary: >
  Centres of crystallization appear at random in the still-liquid part of a metal and grow at a
  given speed. Kolmogorov finds the exact probability that a point is already crystallized at
  time t, 1 − exp(−(4π/3) c³ Ω), which for constant rates is 1 − exp(−(π/3) c³ α t⁴), and the
  total number of grains formed. The result is the starting point of what is now called the
  Kolmogorov–Johnson–Mehl–Avrami theory of phase transformations.
existing_translations:
  - >
    "On the statistical theory of metal crystallization", in Selected Works of A. N. Kolmogorov,
    Vol. II: Probability Theory and Mathematical Statistics (Kluwer, 1992); pages not verified.
copyright:
  status: in-copyright
  note: Author died 1987. No translation is hosted here; the entry carries notes and Lean only.
translation:
  status: none
