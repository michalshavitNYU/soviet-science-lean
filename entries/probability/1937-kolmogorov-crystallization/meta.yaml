help_wanted: >
  Formalize the passage from Eq. (1) to Eq. (2): for continuous α and V′, the product
  ∏ (1 − α(tᵢ) V′(tᵢ) Δt′) tends to exp(−∫₀ᵗ α V′ dt′) as Δt′ → 0. Better still, construct the
  space-time Poisson process of §1 and derive the Poisson count used in `uncrystallized_prob`.
