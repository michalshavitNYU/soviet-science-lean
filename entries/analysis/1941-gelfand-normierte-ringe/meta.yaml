id: 1941-gelfand-normierte-ringe
subject: analysis
title_original: Normierte Ringe
title_en: Normed rings
authors: [I. M. Gelfand]
year: 1941
language: de
source: Matematicheskii Sbornik (N.S.) 9(51) (1941), 3–24.
summary: >
  Founds the theory of commutative Banach algebras. This entry formalizes three basic
  results: the spectrum is nonempty, the spectral radius formula, and the Gelfand–Mazur theorem.
copyright:
  status: in-copyright
  note: Author died 2009. No translation is hosted here; the entry carries notes and Lean only.
translation:
  status: none
