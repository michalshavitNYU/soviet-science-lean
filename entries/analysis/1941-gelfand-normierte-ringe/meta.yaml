contributors: [Michal Shavit]
help_wanted: >
  Formalize the paper's central result, the Gelfand representation: a commutative Banach algebra
  maps into continuous functions on its space of maximal ideals, and x is invertible exactly when
  its transform never vanishes. Mathlib defines the transform (`WeakDual.gelfandTransform`) and
  proves it is an isomorphism for commutative C*-algebras (`gelfandStarTransform`); check what
  else it has, then state the paper's theorems, citing the paper's own theorem numbers.
