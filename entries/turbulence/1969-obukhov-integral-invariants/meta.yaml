      decl: SovietScience.Obukhov1969.energy_identity
    - label: Eq. (9) — energy is constant along solutions
      decl: SovietScience.Obukhov1969.energy_conserved
    - label: Eq. (6) ⇔ (7) — volume preservation iff V_j = 0
      decl: SovietScience.Obukhov1969.divergence_free_iff
    - label: The Boltzmann distribution is stationary
