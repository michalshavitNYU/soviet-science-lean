id: 1969-obukhov-integral-invariants
subject: turbulence
title_original: Об интегральных инвариантах в системах гидродинамического типа
title_en: On integral invariants in systems of hydrodynamic type
authors: [A. M. Obukhov]
year: 1969
language: ru
source: Doklady Akademii Nauk SSSR 184(2) (1969), 309–312.
summary: >
  Defines systems of hydrodynamic type, quadratic ODEs that conserve phase volume and
  energy, as finite-dimensional models of ideal fluid flow, and asks which of them have
  extra quadratic integrals and hence non-trivial Gaussian invariant measures, the question
  that matters for statistical turbulence theory.
copyright:
  status: in-copyright
  note: >
    Author died 1989. Math-Net.Ru gives free access but reserves all rights. An English
    translation by Michal Shavit exists; permission to publish it has been requested.
translation:
  status: none
