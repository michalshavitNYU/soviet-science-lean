id: 1922-friedmann-kruemmung-des-raumes
subject: high-energy
title_original: Über die Krümmung des Raumes
title_en: On the curvature of space
authors: [A. Friedmann]
year: 1922
language: de
source: >
  A. Friedman, "Über die Krümmung des Raumes", Zeitschrift für Physik 10 (1922), 377–386
  (received 29 June 1922; dated Petrograd, 29 May 1922). doi:10.1007/BF01332580.
  Scan: https://archive.org/details/friedmann-alexander-uber-die-krummung-des-raumes
summary: >
  The first solutions of Einstein's field equations describing a world whose space has constant
  positive curvature varying in time. Friedmann reduces the equations to an ODE for the world
  radius R(t), shows that the only static worlds are Einstein's and de Sitter's, and classifies
  the non-static ones by the cosmological constant λ: monotonically expanding worlds, and
  periodic worlds whose radius grows from zero and falls back to zero.
existing_translations:
  - >
    A. Friedman, "On the curvature of space", General Relativity and Gravitation 31(12) (1999),
    1991–2000, doi:10.1023/A:1026751225741 (bibliographic data checked against Crossref; text not
    consulted).
copyright:
  status: public-domain
  note: >
    Friedmann died on 16 September 1925, so his works left copyright in Russia and in Germany
    (author's life + 70 years) at the end of 1995. The German version was published in Germany in
    1922; works published before 1931 are in the public domain in the United States. The German
    translator of Friedmann's Russian manuscript is not named in the journal; an anonymous work
    published in 1922 would also be free in Germany (70 years from publication). The Internet
    Archive scan is linked, not copied.
translation:
  status: complete
  translators: [Claude (AI draft)]
  reviewed_by: []
