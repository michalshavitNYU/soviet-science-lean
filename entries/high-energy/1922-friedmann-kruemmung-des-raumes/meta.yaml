help_wanted: >
  Formalize the integral formulas: (14) for λ = 0, t_π = (2/c)∫₀^A √(x/(A − x)) dx = πA/c (an
  improper integral); the monotonicity of the roots Θ(λ, A), ϑ(λ, A) in §2.3; the properties of
  the time since creation (12) in §2.4, including its divergence as λ → λ₁ when A ≤ 2R₀/3; and
  the periodicity of R for every λ < 0 (§2.6). The reduction of Einstein's equations to (4), (5)
  needs Lorentzian geometry, which Mathlib does not yet have.
