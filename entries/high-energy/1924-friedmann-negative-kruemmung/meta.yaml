id: 1924-friedmann-negative-kruemmung
subject: high-energy
title_original: Über die Möglichkeit einer Welt mit konstanter negativer Krümmung des Raumes
title_en: On the possibility of a world with constant negative curvature of space
authors: [A. Friedmann]
year: 1924
language: de
source: >
  A. Friedmann, "Über die Möglichkeit einer Welt mit konstanter negativer Krümmung des Raumes",
  Zeitschrift für Physik 21 (1924), 326–332 (received 7 January 1924; dated St. Petersburg,
  November 1923). doi:10.1007/BF01328280.
  Scan: https://archive.org/details/friedmann-alexander-uber-die-krummung-des-raumes
summary: >
  The negative-curvature companion of Friedmann's 1922 paper. With space of constant negative
  curvature, written in the half-space form, Friedmann shows that every stationary solution of
  Einstein's equations has zero or negative density, while non-stationary worlds with positive
  density exist: the radius obeys the 1922 equation with the sign of the curvature term reversed,
  and the density is again ρ = 3A/(κR³). He concludes that the field equations alone cannot
  decide whether the world is finite.
existing_translations:
  - >
    A. Friedmann, "On the possibility of a world with constant negative curvature of space",
    General Relativity and Gravitation 31(12) (1999), 2001–2008, doi:10.1023/A:1026755309811
    (bibliographic data checked against Crossref; text not consulted).
copyright:
  status: public-domain
  note: >
    Friedmann died on 16 September 1925, so his works left copyright in Russia and in Germany
    (author's life + 70 years) at the end of 1995. The German text was published in Germany in
    1924; works published before 1931 are in the public domain in the United States. If the
    German text is the work of an unnamed translator, an anonymous work published in 1924 is also
    free in Germany (70 years from publication). The Internet Archive scan is linked, not copied.
translation:
  status: complete
  translators: [Claude (AI draft)]
  reviewed_by: []
