help_wanted: >
  Formalize the stationary analysis of §2, nos. 1–2: the integration of the second-order system
  for M to (1) and (3), the relation λR² = 3 from (4) (printed λR³ = 3), and the vanishing of the
  density for (D′₁) and (D′₂). For λ < 0, prove that solutions are periodic (as for the 1922
  periodic world). The reduction of Einstein's equations to the equations for R needs Lorentzian
  geometry, which Mathlib does not yet have.
