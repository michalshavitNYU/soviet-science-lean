      decl: SovietLean.Friedmann1924.eq7_of_eq6
    - label: (6) ⇒ (8) — for n = 0, L = L₀/x₃
      decl: SovietLean.Friedmann1924.eq8_of_eq6
    - label: (9) is Eq. (4) of the 1922 note with c = 1
      decl: SovietLean.Friedmann1924.eq9_iff_eq4
    - label: §2.3 — along the (D″) equation, R R'² − c²R − (λ/3)R³ has derivative zero
      decl: SovietLean.Friedmann1924.energy_hasDerivAt
    - label: §2.3 — the first integral R'²/c² = (A + R + (λ/(3c²))R³)/R
      decl: SovietLean.Friedmann1924.eqA_of_eqR
    - label: §2.3 — the converse, where R' ≠ 0
      decl: SovietLean.Friedmann1924.eqR_of_eqA
    - label: (10) — ρ = 3A/(κR³)
      decl: SovietLean.Friedmann1924.density_eq
    - label: (10) — ρ > 0 iff A > 0
      decl: SovietLean.Friedmann1924.density_pos_iff
    - label: (D″₃) — a constant radius solves the (D″) equation iff λ = −c²/R²
      decl: SovietLean.Friedmann1924.static_iff
    - label: (D″₃) — ρ = −2/(κR²)
      decl: SovietLean.Friedmann1924.static_density
    - label: §2.2 — the static (D″) world has negative density
      decl: SovietLean.Friedmann1924.static_density_neg
    - label: λ ≥ 0, A ≥ 0 — A + x + (λ/(3c²))x³ > 0 for x > 0
      decl: SovietLean.Friedmann1924.radicand_pos
    - label: λ ≥ 0, A ≥ 0 — the world is monotonic
      decl: SovietLean.Friedmann1924.monotonic_world
    - label: λ < 0 — the radicand is negative for large x
      decl: SovietLean.Friedmann1924.radicand_neg_of_large
    - label: λ < 0, A > 0 — the radicand has a positive root
      decl: SovietLean.Friedmann1924.exists_root_of_neg
    - label: λ < 0 — the radius is bounded
      decl: SovietLean.Friedmann1924.bounded_of_neg
    - label: λ = 0 — the hyperbolic cycloid R(t) solves the first integral
      decl: SovietLean.Friedmann1924.openWorld_eqA
    - label: λ = 0 — R = (A/2)(cosh η − 1) at t = (A/(2c))(sinh η − η)
      decl: SovietLean.Friedmann1924.openWorld_param
    - label: λ = 0 — R = 0 at t = 0
      decl: SovietLean.Friedmann1924.openWorld_zero
    - label: λ = 0 — R is strictly increasing for t ≥ 0
      decl: SovietLean.Friedmann1924.openWorld_strictMonoOn
    - label: λ = 0 — R → ∞ as t → ∞
